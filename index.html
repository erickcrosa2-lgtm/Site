<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Esame</title>

<style>
body {
  margin: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  height: 100vh;
  background: #000;
  overflow: hidden;
}

h1 {
  color: white;
  font-family: Arial, sans-serif;
  font-size: 42px;
  margin-bottom: 25px;
  text-shadow: 0 0 15px rgba(255,255,255,0.8);
}

#subtitle{
  font-size: 28px;
  margin-top: -10px;
  margin-bottom: 25px;
  color: white;
  font-family: Arial, sans-serif;
  text-shadow: 0 0 15px rgba(255,255,255,0.8);
}

canvas {
  display: block;
}

/* Botão Start */
button {
  margin-bottom: 20px;
  padding: 14px 35px;
  border: none;
  border-radius: 999px;
  background: #1f4fa8;
  color: white;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 0 15px rgba(31, 79, 168, 0.6);
  transition: all 0.3s ease;
}

button:hover {
  background: #2b63cc;
  transform: translateY(-2px);
  box-shadow: 0 0 20px rgba(43, 99, 204, 0.9);
}

button:active {
  transform: translateY(0);
}

/* Nome no canto inferior esquerdo */
#author {
  position: fixed;
  bottom: 15px;
  left: 15px;
  color: white;
  font-family: Arial, sans-serif;
  font-size: 16px;
  opacity: 0.85;
}
</style>

</head>
<body>

<h1 id="title">Esame 3^B</h1>
<h1 id="subtitle">Simulazione Fissione Nucleare</h1>

<button id="playBtn">Start</button>

<canvas id="canvas" width="900" height="500"></canvas>

<div id="author">Erick Comicholi Rosa</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const cy = canvas.height/2;

let running = false;

let nuclei = [
  {x:200, y:cy, exploded:false},
  {x:450, y:cy-70, exploded:false},
  {x:450, y:cy+70, exploded:false}
];

let particles = [];
let neutrons = [];
const PARTICLE_COUNT = 100;

class Particle {
  constructor(x,y){
    this.x=x;
    this.y=y;
    this.life=60;

    const a=Math.random()*2*Math.PI;
    const s=Math.random()*4+2;

    this.dx=Math.cos(a)*s;
    this.dy=Math.sin(a)*s;
    this.size=3+Math.random()*2;
  }

  update(){
    this.x+=this.dx;
    this.y+=this.dy;
    this.life--;

    ctx.fillStyle=`rgba(255,140,0,${this.life/60})`;
    ctx.beginPath();
    ctx.shadowColor='orange';
    ctx.shadowBlur=10;
    ctx.arc(this.x,this.y,this.size,0,2*Math.PI);
    ctx.fill();

    return this.life>0;
  }
}

class Neutron {
  constructor(x,y,target,speed=10){
    this.x=x;
    this.y=y;
    this.target=target;
    this.speed=speed;
    this.hit=false;
  }

  update(){
    if(this.hit || !this.target || this.target.exploded) return false;

    const dx=this.target.x-this.x;
    const dy=this.target.y-this.y;
    const dist=Math.sqrt(dx*dx+dy*dy);

    if(dist<25){
      explode(this.target);
      this.hit=true;
      return false;
    }

    const vx=(dx/dist)*this.speed;
    const vy=(dy/dist)*this.speed;

    this.x+=vx;
    this.y+=vy;

    ctx.strokeStyle='rgba(255,255,255,0.3)';
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(this.x-vx*3,this.y-vy*3);
    ctx.lineTo(this.x,this.y);
    ctx.stroke();

    ctx.fillStyle='white';
    ctx.shadowColor='white';
    ctx.shadowBlur=12;
    ctx.beginPath();
    ctx.arc(this.x,this.y,5,0,2*Math.PI);
    ctx.fill();

    return true;
  }
}

function explode(n){
  if(n.exploded) return;

  n.exploded=true;

  for(let i=0;i<PARTICLE_COUNT;i++){
    particles.push(new Particle(n.x,n.y));
  }

  if(n===nuclei[0]){
    setTimeout(()=>{
      neutrons.push(new Neutron(n.x,n.y,nuclei[1]));
      neutrons.push(new Neutron(n.x,n.y,nuclei[2]));
    },50);
  }

  if(nuclei.every(n=>n.exploded)){
    setTimeout(reset,3000);
  }
}

function reset(){
  nuclei.forEach(n=>n.exploded=false);
  particles=[];
  neutrons=[];

  neutrons.push(new Neutron(0,cy,nuclei[0],6));
}

function draw(){
  if(!running) return;

  ctx.fillStyle='#000';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  nuclei.forEach(n=>{
    if(!n.exploded){

      ctx.fillStyle='yellow';
      ctx.shadowColor='yellow';
      ctx.shadowBlur=20;

      ctx.beginPath();
      ctx.arc(n.x,n.y,25,0,2*Math.PI);
      ctx.fill();

      ctx.shadowBlur=0;

      ctx.fillStyle='black';
      ctx.font='bold 14px Arial';
      ctx.textAlign='center';
      ctx.textBaseline='middle';
      ctx.fillText('Pu-239',n.x,n.y);
    }
  });

  neutrons=neutrons.filter(n=>n.update());
  particles=particles.filter(p=>p.update());

  requestAnimationFrame(draw);
}

document.getElementById("playBtn").addEventListener("click",(e)=>{
  if(!running){
    running=true;

    document.getElementById("title").style.display = "none";
    document.getElementById("subtitle").style.display = "none";
    e.target.style.display = "none";

    reset();
    draw();
  }
});
</script>

</body>
</html>
