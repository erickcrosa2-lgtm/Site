<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Esame</title>
<style>
body {
  margin:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  height:100vh;
  background:#000;
}

canvas { display:block; }

button {
  margin-bottom:15px;
  padding:10px 20px;
  font-size:16px;
  cursor:pointer;
}
</style>
</head>
<body>

<button id="playBtn">Start</button>

<canvas id="canvas" width="900" height="500"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const cy = canvas.height/2;

let running = false;

let nuclei = [
  {x:200, y:cy, exploded:false},
  {x:450, y:cy-70, exploded:false},
  {x:450, y:cy+70, exploded:false}
];

let particles = [];
let neutrons = [];
const PARTICLE_COUNT = 100;

// Partículas da explosão
class Particle {
  constructor(x,y){
    this.x=x; this.y=y; this.life=60;
    const a = Math.random()*2*Math.PI;
    const s = Math.random()*4+2;
    this.dx=Math.cos(a)*s;
    this.dy=Math.sin(a)*s;
    this.size = 3 + Math.random()*2;
  }
  update(){
    this.x+=this.dx;
    this.y+=this.dy;
    this.life--;
  
    ctx.fillStyle=`rgba(255,140,0,${this.life/60})`;
    ctx.beginPath();
    ctx.shadowColor='orange';
    ctx.shadowBlur=10;
    ctx.arc(this.x,this.y,this.size,0,2*Math.PI);
    ctx.fill();

    return this.life>0;
  }
}

// Nêutron com alvo
class Neutron {
  constructor(x,y,target,speed=10){
    this.x=x;
    this.y=y;
    this.target=target;
    this.speed=speed;
    this.hit=false;
  }

  update(){
    if(this.hit || !this.target || this.target.exploded) return false;

    const dx = this.target.x - this.x;
    const dy = this.target.y - this.y;
    const dist = Math.sqrt(dx*dx + dy*dy);

    if(dist < 25){
      explode(this.target);
      this.hit=true;
      return false;
    }

    const vx = (dx/dist)*this.speed;
    const vy = (dy/dist)*this.speed;

    this.x += vx;
    this.y += vy;

    // trajetória
    ctx.strokeStyle='rgba(255,255,255,0.3)';
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(this.x-vx*3,this.y-vy*3);
    ctx.lineTo(this.x,this.y);
    ctx.stroke();

    // desenho
    ctx.fillStyle='white';
    ctx.shadowColor='white';
    ctx.shadowBlur=12;
    ctx.beginPath();
    ctx.arc(this.x,this.y,5,0,2*Math.PI);
    ctx.fill();

    return true;
  }
}

// Explosão
function explode(n){
  if(n.exploded) return;
  n.exploded = true;

  for(let i=0;i<PARTICLE_COUNT;i++){
    particles.push(new Particle(n.x,n.y));
  }

  if(n === nuclei[0]){
    setTimeout(()=>{
      neutrons.push(new Neutron(n.x,n.y,nuclei[1]));
      neutrons.push(new Neutron(n.x,n.y,nuclei[2]));
    }, 50);
  }

  if(nuclei.every(n=>n.exploded)){
    setTimeout(reset, 3000);
  }
}

// Reset
function reset(){
  nuclei.forEach(n=>n.exploded=false);
  particles=[];
  neutrons=[];
  neutrons.push(new Neutron(0,cy,nuclei[0],6));
}

// Loop
function draw(){
  if(!running) return;

  ctx.fillStyle='#000';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  nuclei.forEach(n=>{
    if(!n.exploded){
      ctx.fillStyle='yellow';
      ctx.shadowColor='yellow';
      ctx.shadowBlur=20;
      ctx.beginPath();
      ctx.arc(n.x,n.y,25,0,2*Math.PI);
      ctx.fill();

      ctx.shadowBlur=0;
      ctx.fillStyle='black';
      ctx.font='bold 14px Arial';
      ctx.textAlign='center';
      ctx.textBaseline='middle';
      ctx.fillText('P-239', n.x, n.y);
    }
  });

  neutrons = neutrons.filter(n=>n.update());
  particles = particles.filter(p=>p.update());
  requestAnimationFrame(draw);
}

// play
document.getElementById("playBtn").addEventListener("click", (e) => {
  if(!running){
    running = true;

    // nasconde il bottone
    e.target.style.display = "none";

    reset();
    draw();
  }
});
</script>

</body>
</html>
